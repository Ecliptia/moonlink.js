name: Validate NyxLink

on:
  push:
    branches: [dev, v5.2, 'feat/nyxlink-*']
  pull_request:
    branches: [dev, v5.2, feat/nyxlink-foundation, feat/nyxlink-backends, feat/nyxlink-track-storage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run test:types
      - run: pnpm run test:package
      - run: node scripts/generate-api.cjs --check
      - run: pnpm run pack:check
      - run: pnpm audit --prod --audit-level=high
