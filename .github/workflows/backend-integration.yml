name: Local backend protocol integration

on:
  workflow_dispatch:
  push:
    branches: [feat/nyxlink-backends, feat/nyxlink-track-storage]
  pull_request:
    branches: [dev, feat/nyxlink-foundation, feat/nyxlink-backends]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/test-backends.cjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-integration.yml'

permissions:
  contents: read

jobs:
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:backends
        env:
          NYXLINK_CONTAINER_ENGINE: docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-protocol-evidence
          path: .runtime/integration/latest-report.json
          include-hidden-files: true
          if-no-files-found: warn
